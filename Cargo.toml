[package]
name = "ocr-translate"
version = "0.1.0"
edition = "2021"
description = "A small Windows screenshot translation tool"

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "6"
eframe = "0.33"
egui = "0.33"
hex = "0.4"
hmac = "0.12"
rfd = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
windows = { version = "0.61", features = ["Globalization", "Graphics_Imaging", "Media_Ocr", "Storage", "Storage_Streams"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
